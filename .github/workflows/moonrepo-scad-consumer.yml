name: moonrepo real SCAD consumer

on:
  pull_request:
    paths:
      - 'candidates/moonrepo-scad-consumer/**'
      - '.github/workflows/moonrepo-scad-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  scad-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/brainboxemb/scad-toolchain:v0.4.1

    steps:
      - name: Checkout experiment
        uses: actions/checkout@v4

      - name: Install pinned moon binary
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/moon.tar.xz"
          bindir="${RUNNER_TEMP}/moon-bin"
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --retry-all-errors -fsSL \
            'https://github.com/moonrepo/moon/releases/download/v2.5.4/moon_cli-x86_64-unknown-linux-gnu.tar.xz' \
            -o "$archive"
          printf '%s  %s\n' 'baa6f0cda8fe9d7513ffebb2908cfd952888c66659b795da02a14ef2156eb5c7' "$archive" | sha256sum -c -
          mkdir -p "$bindir"
          tar -xJf "$archive" -C "$bindir"
          moon_bin="$(find "$bindir" -type f -name moon -perm -111 -print -quit)"
          test -n "$moon_bin"
          echo "MOON_BIN=$moon_bin" >> "$GITHUB_ENV"

      - name: Run real SCAD consumer qualification
        shell: bash
        run: >-
          python3 candidates/moonrepo-scad-consumer/run_scad_consumer.py
          --moon "$MOON_BIN"
          --output candidates/moonrepo-scad-consumer/results/scad-linux.json

      - name: Upload SCAD orchestration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonrepo-scad-consumer-evidence
          path: candidates/moonrepo-scad-consumer/results
          if-no-files-found: warn
          retention-days: 14
