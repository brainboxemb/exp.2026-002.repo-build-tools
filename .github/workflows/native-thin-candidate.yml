name: native-thin candidate

on:
  push:
    branches:
      - candidate/native-thin
  pull_request:
    paths:
      - 'candidates/native-thin/**'
      - 'fixture/**'
      - 'scripts/validate_fixture.py'
      - '.github/workflows/native-thin-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affected:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate neutral fixture
        run: python scripts/validate_fixture.py

      - name: Run native-thin scenarios on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          python3 candidates/native-thin/run_scenarios.py
          --platform linux-x86_64
          --output candidates/native-thin/results/native-linux.json

      - name: Run native-thin scenarios on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python candidates/native-thin/run_scenarios.py
          --platform windows-x86_64
          --output candidates/native-thin/results/native-windows.json

      - name: Upload native-thin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-thin-candidate-${{ runner.os }}
          path: candidates/native-thin/results/*.json
          if-no-files-found: warn
          retention-days: 14
