name: moonrepo real docs consumer

on:
  pull_request:
    paths:
      - 'candidates/moonrepo-docs-consumer/**'
      - '.github/workflows/moonrepo-docs-consumer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned moon binary
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/moon.tar.xz"
          bindir="${RUNNER_TEMP}/moon-bin"
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 --retry-all-errors -fsSL \
            'https://github.com/moonrepo/moon/releases/download/v2.5.4/moon_cli-x86_64-unknown-linux-gnu.tar.xz' \
            -o "$archive"
          printf '%s  %s\n' 'baa6f0cda8fe9d7513ffebb2908cfd952888c66659b795da02a14ef2156eb5c7' "$archive" | sha256sum -c -
          mkdir -p "$bindir"
          python3 - "$archive" "$bindir" <<'PY'
          import sys
          import tarfile
          archive, bindir = sys.argv[1:]
          with tarfile.open(archive, mode='r:xz') as handle:
              handle.extractall(bindir)
          PY
          moon_bin="$(find "$bindir" -type f -name moon -perm -111 -print -quit)"
          test -n "$moon_bin"
          echo "MOON_BIN=$moon_bin" >> "$GITHUB_ENV"

      - name: Run real documentation consumer qualification
        shell: bash
        run: >-
          python3 candidates/moonrepo-docs-consumer/run_docs_consumer.py
          --moon "$MOON_BIN"
          --output candidates/moonrepo-docs-consumer/results/docs-linux.json

      - name: Upload documentation orchestration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moonrepo-docs-consumer-evidence
          path: candidates/moonrepo-docs-consumer/results
          if-no-files-found: warn
          retention-days: 14
